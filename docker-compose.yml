  #     - mysql
  #   environment:
  #     - AIRFLOW__CORE__EXECUTOR=LocalExecutor
  #     - AIRFLOW__CORE__DEFAULT_TIMEZONE=America/Los_Angeles
  #     - AIRFLOW__CORE__SQL_ALCHEMY_CONN=mysql://airflow_user:airflow_pass@mysql:3306/airflow_db


volumes:
  mysql-db-volume: # Define the MySQL data volume